spring.application.name=gateway-server
server.port= 8072

management.endpoints.web.exposure.include=*
management.info.env.enabled= true

info.app.name= gatewayserver
info.app.description= Travel Agency System Gateway Server Application
info.app.version= 1.0.0

management.endpoint.gateway.access=unrestricted 
spring.cloud.gateway.server.webflux.discovery.locator.enabled= true

# to access the url using microservice name in lower case
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id: true


eureka.instance.preferIpAddress: true

#jwt configs
security.jwt.secret:my-super-secret-key-my-super-secret-key-12345
security.jwt.expiry: 3600000