spring.application.name=auth-server
server.port=8071

spring.datasource.url=jdbc:mysql://localhost:3306/db_auth
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

eureka.client.fetchRegistry=true
eureka.client.registerWithEureka=true
eureka.instance.preferIpAddress=true

security.jwt.secret=my-super-secret-key-my-super-secret-key-12345
# 1 hour in milliseconds
security.jwt.expiry=3600000   

info.app.name= authserver
info.app.description= Travel Agency System Auth Server Application
info.app.version= 1.0.0